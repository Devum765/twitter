<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ランダム JSON 表示</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; padding: 24px; background: #f7fafc; color:#0f172a }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 6px 18px rgba(15,23,42,0.06); margin-bottom:12px }
    label { display:inline-block; margin-right:8px }
    input, select, button { font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db }
    button { cursor:pointer; background:#111827; color:white; border: none }
    .controls { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap }
    pre { white-space:pre-wrap; word-break:break-word; background:#0f172a; color:#f8fafc; padding:12px; border-radius:8px }
    .meta { color:#475569; font-size:13px }
  </style>
</head>
<body>
  <h1>ランダム JSON 表示</h1>
  <p>外部 JSON ファイル (<code>data.json</code>) からデータを読み込み、ランダムまたはタグ指定で要素を表示します。</p>

  <div class="card">
    <div class="controls">
      <label for="count">表示数</label>
      <input id="count" type="number" min="1" max="10" value="1" style="width:70px" />

      <label for="tagFilter">タグ（空欄で無視）</label>
      <input id="tagFilter" type="text" placeholder="例: news" />

      <button id="btnRandom">ランダム表示</button>
      <button id="btnShowTag">タグの全データ表示</button>
      <button id="btnShuffleAll">全データをシャッフル表示</button>
    </div>
  </div>

  <div id="results"></div>

  <script>
    let data = [];

    // 外部JSONファイルを読み込み
    async function loadJson() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('JSONファイルの読み込みに失敗しました。');
        data = await response.json();
        renderItems(pickRandom({ count: 1 }));
      } catch (e) {
        document.getElementById('results').innerHTML = `<div class="card">${escapeHtml(e.message)}</div>`;
      }
    }

    function getRandomItems(arr, n) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    function pickRandom({ count = 1, tag = '' } = {}) {
      if (!data || data.length === 0) return [];
      let pool = data;
      if (tag && tag.trim() !== '') {
        const t = tag.trim();
        pool = data.filter(item => String(item.tag) === t);
      }
      if (pool.length === 0) return [];
      const c = Math.min(count, pool.length);
      return getRandomItems(pool, c);
    }

    function showAllByTag(tag) {
      if (!data || data.length === 0) return [];
      const t = tag.trim();
      return data.filter(item => String(item.tag) === t);
    }

    function renderItems(items) {
      const results = document.getElementById('results');
      results.innerHTML = '';
      if (!items || items.length === 0) {
        results.innerHTML = '<div class="card">選択された要素はありません。</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="meta">tag: ${escapeHtml(String(item.tag))} &nbsp;|&nbsp; number: ${escapeHtml(String(item.number))}</div>
          <h3>${escapeHtml(String(item.body))}</h3>
          <p>${escapeHtml(String(item.argument))}</p>
        `;
        results.appendChild(card);
      });
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    }

    document.getElementById('btnRandom').addEventListener('click', () => {
      const count = Math.max(1, parseInt(document.getElementById('count').value || '1', 10));
      const tag = document.getElementById('tagFilter').value || '';
      const items = pickRandom({ count, tag });
      renderItems(items);
    });

    document.getElementById('btnShuffleAll').addEventListener('click', () => {
      if (!data || data.length === 0) return;
      const items = getRandomItems(data, data.length);
      renderItems(items);
    });

    document.getElementById('btnShowTag').addEventListener('click', () => {
      const tag = document.getElementById('tagFilter').value || '';
      if (!tag.trim()) {
        document.getElementById('results').innerHTML = '<div class="card">タグを入力してください。</div>';
        return;
      }
      const items = showAllByTag(tag);
      renderItems(items);
    });

    // 初期化
    loadJson();
  </script>
</body>
</html>
